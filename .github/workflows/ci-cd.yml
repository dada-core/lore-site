name: CI/CD

# Checks every change to the website, and publishes it from the deploy branch.
#   personal branch (dev-wil) -> pull request -> develop (reference) -> pull request -> deploy (published)
# - Push to any branch, pull request to develop or deploy: typography, types, build, internal links.
# - Push to deploy (a merged pull request): the same checks, then publication on lore.dada-core.com
#   with GitHub Pages (Settings > Pages > Source: GitHub Actions; the github-pages environment
#   only accepts the deploy branch).

on:
  push:
  pull_request:
    branches: [develop, deploy]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the checks still running on the same branch, except on deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/deploy' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: No em dash in the sources
        run: |
          if LC_ALL=C.UTF-8 grep -rnIP '\x{2014}' src public scripts README.md astro.config.mjs; then
            echo "::error::Em dash found: rewrite these lines with a colon, a comma or parentheses."
            exit 1
          fi
      - name: Types
        run: npm run check
      - name: Build
        run: npm run build
      - name: Internal links
        run: npm run links
      - name: Site to publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
